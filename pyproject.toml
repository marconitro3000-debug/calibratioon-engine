[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "calibration-engine"
version = "0.3.0"
description = "Offline reusable parameter calibration engine for Python models and simulations."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name="Calibration Engine"}]
license = {text="MIT"}
keywords = ["calibration", "optimization", "hyperparameter-optimization", "experiments", "research"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["numpy>=1.23", "pandas>=1.5"]

[project.urls]
Homepage = "https://github.com/marconitro3000-debug/calibratioon-engine"
Repository = "https://github.com/marconitro3000-debug/calibratioon-engine"
Issues = "https://github.com/marconitro3000-debug/calibratioon-engine/issues"

[project.optional-dependencies]
dev = [
    "black>=24.0",
    "mypy>=1.8",
    "pre-commit>=3.6",
    "pytest>=7",
    "ruff>=0.4",
]
notebook = ["notebook>=7"]

[project.scripts]
calibration-engine = "calibration_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.black]
line-length = 120
target-version = ["py310"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = [
    "E501",  # Black owns line wrapping.
]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_configs = true
check_untyped_defs = false
disallow_untyped_defs = false
no_implicit_optional = true
