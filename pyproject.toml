[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "open-alpha-lab"
version = "0.3.0"
description = "Research-grade alpha discovery, calibration and validation engine for systematic trading workflows."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name="OpenAlphaLab"}]
license = {text="MIT"}
dependencies = ["numpy>=1.23", "pandas>=1.5"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
open-alpha-lab = "alpha_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
